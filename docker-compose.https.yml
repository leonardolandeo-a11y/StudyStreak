services:
  proxy:
    image: caddy:2-alpine
    restart: unless-stopped

    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Define APP_DOMAIN en .env.aws}

    ports:
      - "80:80"
      - "443:443"

    volumes:
      - type: bind
        source: ./deploy/Caddyfile
        target: /etc/caddy/Caddyfile
        read_only: true
        bind:
          create_host_path: false

      - caddy_data:/data
      - caddy_config:/config

    depends_on:
      - app

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  caddy_data:
  caddy_config: