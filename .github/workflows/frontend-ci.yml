name: Frontend CI

on:
  push:
  pull_request:
    branches:
      - main

jobs:
  frontend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend-web

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Test web authentication
        run: npm run test:auth

      - name: Build frontend
        run: npm run build

  mobile:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend-mobile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend-mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run mobile session and JWT tests
        run: npm run test:auth

      - name: Run mobile ESLint
        run: npm run lint -- --max-warnings 0

      - name: Validate mobile TypeScript
        run: npx --no-install tsc --noEmit
