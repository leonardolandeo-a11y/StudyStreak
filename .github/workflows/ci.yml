name: Backend CI

on:
  push:
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: studystreak
          POSTGRES_USER: studystreak
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U studystreak -d studystreak"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/studystreak
      SPRING_DATASOURCE_USERNAME: studystreak
      SPRING_DATASOURCE_PASSWORD: ""
      JWT_EXPIRATION: 86400000
      JWT_REFRESH_EXPIRATION: 604800000
      MAIL_HOST: localhost
      MAIL_PORT: 1025
      MAIL_USERNAME: ci@example.com
      MAIL_PASSWORD: ci

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Generate JWT secret
        shell: bash
        run: echo "JWT_SECRET=$(openssl rand -base64 32)" >> "$GITHUB_ENV"

      - name: Run backend tests
        run: ./mvnw clean test
