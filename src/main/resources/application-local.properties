# Opt in only for an explicitly selected development database.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.hbm2ddl.halt_on_error=true
# Keep Hibernate, JDBC repositories and SQL migrations in the same schema.
spring.datasource.hikari.schema=${APP_DB_SCHEMA:public}
spring.jpa.properties.hibernate.default_schema=${APP_DB_SCHEMA:public}
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=${APP_AUTH_SCHEMA_INIT:never}
spring.sql.init.schema-locations=classpath:db/migrations/2026-11-06_reconcile_jpa_sequences.sql,classpath:db/migrations/2026-10-30_create_refresh_sessions.sql
spring.sql.init.continue-on-error=false
# The reconciliation uses a PostgreSQL DO block containing semicolons.
spring.sql.init.separator=^^^ END OF SCRIPT ^^^
