spring.application.name=StudyStreak

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/studystreak}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:studystreak}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION}
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:604800000}

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

spring.servlet.multipart.max-file-size=3MB
spring.servlet.multipart.max-request-size=3MB

# Optional media; never use these signing keys in client builds.
study.media.enabled=${LIVEKIT_ENABLED:false}
study.media.url=${LIVEKIT_URL:}
study.media.internal-url=${LIVEKIT_INTERNAL_URL:}
study.media.api-key=${LIVEKIT_API_KEY:}
study.media.api-secret=${LIVEKIT_API_SECRET:}
